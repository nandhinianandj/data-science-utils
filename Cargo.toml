[workspace]
members = [
    "datascienceutils-core",
    "datascienceutils-py",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Software Mechanic <softwaremechanic32@gmail.com>"]
license = "GPL-3.0"
repository = "https://github.com/emofeedback/data-science-utils"

[workspace.dependencies]
# Core numerical computing
ndarray = { version = "0.15", features = ["rayon", "serde"] }
ndarray-stats = "0.5"
ndarray-rand = "0.14"
ndarray-linalg = { version = "0.16", features = ["openblas-static"] }

# DataFrames
polars = { version = "0.35", features = ["lazy", "dtype-full", "parquet", "csv"] }

# Machine Learning
linfa = "0.7"
linfa-clustering = "0.7"
linfa-reduction = "0.7"
linfa-preprocessing = "0.7"
linfa-trees = "0.7"
linfa-linear = "0.7"
linfa-svm = "0.7"
linfa-tsne = "0.7"
smartcore = "0.3"

# Statistics
statrs = "0.16"
rand = "0.8"
rand_distr = "0.4"

# Plotting
plotters = { version = "0.3", features = ["all_series", "all_elements"] }
plotters-backend = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Python bindings
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"] }
numpy = "0.20"

# Utilities
thiserror = "1.0"
anyhow = "1.0"
cached = "0.46"
rayon = "1.8"
chrono = "0.4"
either = "1.9"

# Time series
augurs = "0.10"

# Neural Networks
burn = { version = "0.14", features = ["train", "std"] }
burn-ndarray = "0.14"
burn-autodiff = "0.14"
burn-import = { version = "0.14", features = ["onnx"] }

# Model Quantization
ort = { version = "2.0.0-rc.10", features = ["load-dynamic"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
